server {
  listen 443 ssl;
  server_name isp.example.id;
  ssl_certificate /etc/ssl/isp/fullchain.pem;
  ssl_certificate_key /etc/ssl/isp/privkey.pem;
  location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
  location / { root /opt/isp/frontend/dist; try_files $uri /index.html; }
}
